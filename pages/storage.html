<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05071a"><title>مساحة Opera</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    .storage-wrap{max-width:1100px;margin:0 auto;padding:42px 20px 80px}.storage-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.storage-head h1{margin:0}.storage-head p{color:var(--mut);margin:8px 0 0}.storage-actions{display:flex;gap:10px;flex-wrap:wrap}.storage-actions button,.upload-label{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:inherit;border-radius:12px;padding:11px 16px;cursor:pointer;font:inherit}.storage-actions .primary{background:var(--b);color:#06101d;border-color:transparent;font-weight:700}.upload-label input{display:none}.storage-card{background:rgba(10,14,38,.72);border:1px solid rgba(255,255,255,.12);border-radius:22px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.25)}.storage-bar{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;gap:12px}.crumb{color:var(--mut);direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.storage-status{min-height:24px;padding:0 20px;color:var(--mut)}.storage-table{width:100%;border-collapse:collapse}.storage-table th,.storage-table td{text-align:right;padding:15px 20px;border-bottom:1px solid rgba(255,255,255,.08)}.storage-table th{color:var(--mut);font-size:13px}.storage-table td:first-child{font-weight:600}.storage-table tr:hover{background:rgba(255,255,255,.045)}.file-link{color:inherit;background:none;border:0;font:inherit;cursor:pointer}.file-link:hover{color:var(--b)}.file-actions{display:flex;gap:8px;justify-content:flex-start}.file-actions a,.file-actions button{color:var(--mut);background:none;border:0;cursor:pointer;font:inherit}.file-actions a:hover,.file-actions button:hover{color:#ff7b9d}.empty{text-align:center;padding:55px 20px;color:var(--mut)}.back-home{display:inline-block;color:var(--mut);margin-bottom:25px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:5}.modal[hidden]{display:none}.modal-box{width:min(420px,calc(100% - 32px));background:#101633;border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:24px}.modal-box input{width:100%;box-sizing:border-box;margin:14px 0;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#080d24;color:#fff;font:inherit}.modal-actions{display:flex;gap:10px;justify-content:flex-start}.modal-actions button{padding:10px 16px;border-radius:10px;border:0;font:inherit;cursor:pointer}.modal-actions .primary{background:var(--b)}@media(max-width:650px){.storage-head{display:block}.storage-actions{margin-top:18px}.storage-table th:nth-child(3),.storage-table td:nth-child(3){display:none}}
  </style>
</head>
<body>
  <main class="storage-wrap">
    <a class="back-home" href="../index.html">← العودة إلى Opera</a>
    <header class="storage-head"><div><h1>مساحة Opera</h1><p id="welcome">جاري التحقق من الحساب…</p></div><div class="storage-actions"><label class="upload-label">رفع ملف<input id="upload" type="file"></label><button class="primary" id="new-folder">مجلد جديد</button><button id="logout">خروج</button></div></header>
    <section class="storage-card"><div class="storage-bar"><span class="crumb" id="crumb">/</span><button id="up" class="file-link">المجلد السابق</button></div><p class="storage-status" id="status" role="status"></p><table class="storage-table"><thead><tr><th>الاسم</th><th>النوع</th><th>الإجراء</th></tr></thead><tbody id="files"></tbody></table><div class="empty" id="empty" hidden>لا توجد ملفات هنا بعد.</div></section>
  </main>
  <div class="modal" id="folder-modal" hidden><div class="modal-box"><h2>إنشاء مجلد</h2><input id="folder-name" placeholder="اسم المجلد" maxlength="80"><div class="modal-actions"><button class="primary" id="create-folder">إنشاء</button><button id="cancel-folder">إلغاء</button></div></div></div>
  <script type="module" src="../assets/js/storage.js"></script>
</body>
</html>
